# ULTRON Render Blueprint — free preview profile.
# Free Render Postgres expires after 30 days; upgrade before storing important data.
services:
  - type: web
    name: ultron-ai
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: PGSSLMODE
        value: require
      - key: ULTRON_SESSION_SECRET
        generateValue: true
      - key: ULTRON_SETUP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ultron-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.2-astra
      - key: ULTRON_TOKEN_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: ultron-db
    plan: free
    region: singapore
    databaseName: ultron
    user: ultron
